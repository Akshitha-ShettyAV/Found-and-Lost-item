<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Found & Lost - Dashboard</title>
    <style>
      :root {
        --navy: #192638;
        --navy-2: #223247;
        --blue: #3568df;
        --blue-soft: #eef3ff;
        --orange: #ef8c45;
        --orange-soft: #fff2e8;
        --green: #43a878;
        --green-soft: #eaf7f1;
        --red: #d95858;
        --red-soft: #fdeeee;
        --gray-50: #f7f8fa;
        --gray-100: #f1f3f6;
        --gray-200: #e7eaf0;
        --gray-400: #9aa3b2;
        --gray-600: #657184;
        --text: #263244;
        --white: #fff;
        --shadow: 0 8px 26px rgba(35, 46, 67, .07);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background: #f7f8fb;
        min-width: 320px;
      }

      button, input { font: inherit; }
      button { cursor: pointer; }

      .app { min-height: 100vh; display: grid; grid-template-columns: 236px 1fr; }

      .sidebar {
        background: var(--navy);
        color: #d9e0ea;
        display: flex;
        flex-direction: column;
        padding: 28px 18px 20px;
        position: fixed;
        height: 100vh;
        width: 236px;
      }

      .brand { display: flex; align-items: center; gap: 10px; padding: 0 12px 30px; }
      .brand-mark {
        width: 38px; height: 38px; border-radius: 10px;
        background: #fff; display: grid; place-items: center;
        color: var(--navy); position: relative;
      }
      .brand-mark svg { width: 24px; height: 24px; }
      .brand-name { color: #fff; font-weight: 750; font-size: 18px; letter-spacing: -.3px; }

      .nav { display: flex; flex-direction: column; gap: 5px; }
      .nav-item {
        border: 0; background: transparent; color: #b8c2d1;
        height: 46px; border-radius: 8px; display: flex; align-items: center;
        gap: 12px; padding: 0 13px; font-size: 14px; text-align: left;
        width: 100%;
      }
      .nav-item svg { width: 20px; height: 20px; stroke-width: 1.8; }
      .nav-item.active { background: var(--blue); color: #fff; box-shadow: 0 7px 18px rgba(53,104,223,.24); }
      .nav-item:hover:not(.active) { background: rgba(255,255,255,.06); color: #fff; }

      .sidebar-bottom { margin-top: auto; border-top: 1px solid rgba(255,255,255,.08); padding-top: 16px; }
      .profile { display: flex; align-items: center; gap: 10px; padding: 8px 8px 0; }
      .profile-avatar {
        width: 38px; height: 38px; border-radius: 50%;
        background: #d8c8b7; display: grid; place-items: center;
        color: #6d5541; font-weight: 700; font-size: 13px;
      }
      .profile-name { color: #fff; font-size: 13px; font-weight: 700; }
      .profile-role { color: #93a0b2; font-size: 11px; margin-top: 3px; }

      .main { grid-column: 2; min-width: 0; }
      .topbar {
        height: 78px; background: #fff; border-bottom: 1px solid var(--gray-200);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 38px;
      }
      .topbar-title { font-size: 22px; font-weight: 750; letter-spacing: -.4px; }
      .topbar-actions { display: flex; align-items: center; gap: 12px; }
      .icon-button {
        width: 40px; height: 40px; border: 1px solid var(--gray-200);
        border-radius: 8px; background: #fff; display: grid; place-items: center;
        color: var(--gray-600);
      }
      .icon-button svg { width: 19px; height: 19px; }
      .notification { position: relative; }
      .notification::after {
        content: ""; position: absolute; width: 7px; height: 7px;
        border-radius: 50%; background: var(--red); right: 8px; top: 7px;
        border: 2px solid #fff;
      }

      .content { padding: 30px 38px 44px; }
      .page-state {
        min-height: 300px; background: #fff; border: 1px solid var(--gray-200);
        border-radius: 10px; box-shadow: var(--shadow); display: grid;
        align-content: center; justify-items: center; text-align: center;
        padding: 32px 20px;
      }
      .page-state[hidden] { display: none; }
      .page-state-icon {
        width: 52px; height: 52px; border-radius: 14px; display: grid;
        place-items: center; background: var(--blue-soft); color: var(--blue);
        margin-bottom: 15px;
      }
      .page-state-icon svg { width: 25px; height: 25px; }
      .page-state h2 { margin: 0; color: var(--text); font-size: 18px; }
      .page-state p { margin: 8px 0 0; color: var(--gray-600); font-size: 13px; }
      .empty-row { height: 120px; text-align: center; color: var(--gray-600); }
      .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
      .summary-card {
        background: #fff; border: 1px solid var(--gray-200); border-radius: 10px;
        min-height: 118px; padding: 18px 18px 16px;
        box-shadow: 0 3px 12px rgba(35,46,67,.025);
      }
      .summary-top { display: flex; align-items: center; justify-content: space-between; }
      .summary-label { color: var(--gray-600); font-size: 13px; font-weight: 650; }
      .summary-icon {
        width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center;
      }
      .summary-icon svg { width: 19px; height: 19px; }
      .summary-icon.blue { background: var(--blue-soft); color: var(--blue); }
      .summary-icon.orange { background: var(--orange-soft); color: var(--orange); }
      .summary-icon.green { background: var(--green-soft); color: var(--green); }
      .summary-icon.red { background: var(--red-soft); color: var(--red); }
      .summary-value { margin-top: 14px; font-size: 28px; line-height: 1; font-weight: 760; letter-spacing: -.7px; }
      .summary-change { margin-top: 8px; font-size: 11px; color: var(--gray-400); }
      .summary-change strong { color: var(--green); }

      .panel { background: #fff; border: 1px solid var(--gray-200); border-radius: 10px; box-shadow: var(--shadow); }
      .panel-header {
        min-height: 72px; display: flex; align-items: center; justify-content: space-between;
        padding: 14px 18px; border-bottom: 1px solid var(--gray-200); gap: 16px;
      }
      .tabs { display: flex; align-items: center; gap: 4px; }
      .tab {
        border: 0; background: transparent; color: var(--gray-600); height: 38px;
        border-radius: 7px; padding: 0 12px; font-size: 13px; font-weight: 650;
      }
      .tab.active { background: var(--blue-soft); color: var(--blue); }
      .tab-count {
        display: inline-grid; place-items: center; min-width: 20px; height: 20px;
        border-radius: 10px; background: var(--gray-100); margin-left: 5px; font-size: 11px;
      }
      .tab.active .tab-count { background: #dbe5ff; }

      .table-tools { display: flex; align-items: center; gap: 9px; }
      .search { position: relative; }
      .search svg {
        position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
        width: 16px; height: 16px; color: var(--gray-400);
      }
      .search input {
        width: 200px; height: 38px; border: 1px solid var(--gray-200); border-radius: 7px;
        padding: 0 10px 0 34px; outline: none; color: var(--text); background: #fff;
      }
      .search input:focus { border-color: #aebcf1; box-shadow: 0 0 0 3px var(--blue-soft); }
      .filter-button {
        height: 38px; border: 1px solid var(--gray-200); border-radius: 7px;
        background: #fff; color: var(--gray-600); display: flex; align-items: center;
        gap: 7px; padding: 0 11px; font-size: 13px; font-weight: 650;
      }
      .filter-button svg { width: 16px; height: 16px; }

      table { width: 100%; border-collapse: collapse; }
      th {
        height: 44px; text-align: left; background: var(--gray-50);
        color: var(--gray-600); font-size: 11px; text-transform: uppercase;
        letter-spacing: .45px; font-weight: 750; border-bottom: 1px solid var(--gray-200);
        padding: 0 14px;
      }
      th:first-child, td:first-child { padding-left: 18px; }
      td {
        height: 76px; border-bottom: 1px solid var(--gray-200);
        font-size: 13px; padding: 8px 14px; vertical-align: middle;
      }
      tbody tr:last-child td { border-bottom: 0; }
      tbody tr:hover { background: #fbfcfe; }

      .item-cell { display: flex; align-items: center; gap: 11px; min-width: 210px; }
      .item-thumb {
        width: 46px; height: 46px; border-radius: 8px; overflow: hidden;
        background: #edf0f4; flex: 0 0 auto; display: grid; place-items: center;
      }
      .item-thumb svg { width: 31px; height: 31px; }
      .item-name { font-weight: 730; color: #283449; }
      .item-id { color: var(--gray-400); font-size: 11px; margin-top: 4px; }

      .category { color: var(--gray-600); }
      .date { color: var(--gray-600); white-space: nowrap; }
      .location { color: var(--gray-600); min-width: 110px; }
      .status {
        display: inline-flex; align-items: center; height: 26px; padding: 0 9px;
        border-radius: 13px; font-size: 11px; font-weight: 750; white-space: nowrap;
      }
      .status.reported { background: var(--orange-soft); color: #c56d32; }
      .status.claimed { background: var(--blue-soft); color: var(--blue); }
      .status.resolved { background: var(--green-soft); color: #348b65; }
      .status.pending { background: #f1f3f6; color: #738096; }

      .action-wrap { text-align: right; min-width: 82px; }
      .action-button {
        border: 1px solid var(--gray-200); background: #fff; width: 32px; height: 32px;
        border-radius: 7px; color: var(--gray-600); display: inline-grid; place-items: center;
      }
      .action-button svg { width: 16px; height: 16px; }
      .action-menu {
        position: fixed; z-index: 20; width: 148px; padding: 5px;
        background: #fff; border: 1px solid var(--gray-200); border-radius: 8px;
        box-shadow: 0 12px 30px rgba(35,46,67,.16); display: none;
      }
      .action-menu.open { display: block; }
      .action-menu button {
        width: 100%; height: 34px; border: 0; border-radius: 5px;
        background: transparent; text-align: left; padding: 0 9px;
        color: var(--text); font-size: 12px;
      }
      .action-menu button:hover { background: var(--gray-100); }

      .panel-footer {
        height: 58px; border-top: 1px solid var(--gray-200);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 18px; color: var(--gray-600); font-size: 12px;
      }
      .pagination { display: flex; align-items: center; gap: 5px; }
      .page-button {
        width: 30px; height: 30px; border: 1px solid var(--gray-200);
        border-radius: 6px; background: #fff; color: var(--gray-600);
        display: grid; place-items: center; font-size: 12px;
      }
      .page-button.active { background: var(--blue); border-color: var(--blue); color: #fff; }
      .page-button svg { width: 14px; height: 14px; }

      .mobile-menu { display: none; }

      @media (max-width: 1100px) {
        .summary-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
        .table-scroll { overflow-x: auto; }
        table { min-width: 860px; }
      }
      @media (max-width: 760px) {
        .app { grid-template-columns: 1fr; }
        .sidebar { transform: translateX(-100%); z-index: 50; transition: transform .2s; }
        .sidebar.open { transform: translateX(0); }
        .main { grid-column: 1; }
        .topbar { height: 68px; padding: 0 18px; }
        .topbar-title { font-size: 18px; }
        .mobile-menu { display: grid; }
        .content { padding: 18px 14px 30px; }
        .summary-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
        .summary-card { min-height: 108px; padding: 14px; }
        .summary-value { font-size: 24px; }
        .panel-header { align-items: flex-start; flex-direction: column; padding: 12px; }
        .tabs { width: 100%; overflow-x: auto; }
        .tab { white-space: nowrap; }
        .table-tools { width: 100%; }
        .search { flex: 1; }
        .search input { width: 100%; }
      }
      @media (max-width: 430px) {
        .summary-grid { grid-template-columns: 1fr 1fr; }
        .summary-label { font-size: 12px; }
        .summary-icon { width: 34px; height: 34px; }
        .topbar-actions .icon-button:first-child { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-label="Found and Lost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3a7 7 0 0 0-7 7c0 5 7 11 7 11s7-6 7-11a7 7 0 0 0-7-7Z"/>
              <circle cx="12" cy="10" r="2.5"/>
            </svg>
          </div>
        </div>
        <nav class="nav">
          <button class="nav-item active" data-page="Dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Dashboard
          </button>
          <button class="nav-item" data-page="Items Found">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>
            Items Found
          </button>
          <button class="nav-item" data-page="Items Lost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>
            Items Lost
          </button>
          <button class="nav-item" data-page="Claim Requests">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="8" r="3"/><path d="M3 19c.5-4 2.5-6 6-6s5.5 2 6 6"/><path d="m17 10 2 2 3-4"/></svg>
            Claim Requests
          </button>
        </nav>
        <div class="sidebar-bottom">
          <button class="nav-item" data-page="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2H12.8V20a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H6.6v-2.6h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L8 8.4l1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V5.2H15v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2V14H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
            Settings
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div style="display:flex;align-items:center;gap:10px">
            <button class="icon-button mobile-menu" id="menuButton" aria-label="Open menu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="topbar-title">Dashboard</div>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" aria-label="Search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            </button>
            <button class="icon-button notification" aria-label="Notifications">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"/><path d="M10 21h4"/></svg>
            </button>
          </div>
        </header>

        <div class="content">
          <div class="dashboard-content" id="dashboardContent">
          <section class="summary-grid">
            <article class="summary-card">
              <div class="summary-top"><span class="summary-label">Total Reports</span><span class="summary-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h14v18H5z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg></span></div>
              <div class="summary-change">This month</div>
            </article>
            <article class="summary-card">
              <div class="summary-top"><span class="summary-label">Active Claims</span><span class="summary-icon orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/></svg></span></div>
              <div class="summary-change">Awaiting review</div>
            </article>
            <article class="summary-card">
              <div class="summary-top"><span class="summary-label">Items Returned</span><span class="summary-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg></span></div>
              <div class="summary-change">Success rate</div>
            </article>
            <article class="summary-card">
              <div class="summary-top"><span class="summary-label">Pending Action</span><span class="summary-icon red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span></div>
              <div class="summary-change">Needs your attention</div>
            </article>
          </section>

          <section class="panel">
            <div class="panel-header">
              <div class="tabs" role="tablist">
                <button class="tab active" data-filter="all">All Items</button>
                <button class="tab" data-filter="found">Items Found</button>
                <button class="tab" data-filter="lost">Items Lost</button>
              </div>
              <div class="table-tools">
                <div class="search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                  <input id="searchInput" type="search" placeholder="Search items..." aria-label="Search items" />
                </div>
                <button class="filter-button" id="filterButton">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16l-6 7v5l-4 2v-7L4 5Z"/></svg>
                  Filter
                </button>
              </div>
            </div>
            <div class="table-scroll">
              <table>
                <thead>
                  <tr><th>Item</th><th>Category</th><th>Date Reported</th><th>Location</th><th>Status</th><th></th></tr>
                </thead>
                <tbody id="itemsTable"><tr><td class="empty-row" colspan="6">No items to display.</td></tr></tbody>
              </table>
            </div>
            <div class="panel-footer">
              <div class="pagination">
                <button class="page-button" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
                <button class="page-button" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
              </div>
            </div>
          </section>
          </div>
          <section class="page-state" id="pageState" hidden aria-live="polite">
            <div class="page-state-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>
            </div>
            <h2 id="pageStateTitle"></h2>
            <p id="pageStateMessage"></p>
          </section>
        </div>
      </main>
    </div>

    <div class="action-menu" id="actionMenu">
      <button data-action="View details">View details</button>
      <button data-action="Update status">Update status</button>
      <button data-action="View claims">View claims</button>
    </div>

    <script>
      const emptyMessages = {
        "Items Found": "No found items yet. Items reported as found will appear here.",
        "Items Lost": "No lost items yet. Items reported as lost will appear here.",
        "Claim Requests": "No claim requests yet.",
        "Settings": "Settings are not available yet."
      };
      const dashboardContent = document.getElementById("dashboardContent");
      const pageState = document.getElementById("pageState");
      const pageTitle = document.querySelector(".topbar-title");
      const pageStateTitle = document.getElementById("pageStateTitle");
      const pageStateMessage = document.getElementById("pageStateMessage");
      const itemsTable = document.getElementById("itemsTable");

      function showPage(page) {
        pageTitle.textContent = page;
        dashboardContent.hidden = page !== "Dashboard";
        pageState.hidden = page === "Dashboard";
        if (page !== "Dashboard") {
          pageStateTitle.textContent = page;
          pageStateMessage.textContent = emptyMessages[page] || "Nothing to display yet.";
        }
      }

      document.querySelectorAll(".nav-item").forEach(button => button.addEventListener("click", () => {
        if (button.dataset.page) {
          document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
          button.classList.add("active");
          showPage(button.dataset.page);
          document.getElementById("sidebar").classList.remove("open");
        }
      }));

      document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(button => button.classList.remove("active"));
        tab.classList.add("active");
        const label = tab.textContent.trim();
        itemsTable.innerHTML = `<tr><td class="empty-row" colspan="6">No ${label === "All Items" ? "items" : label.toLowerCase()} to display.</td></tr>`;
      }));

      document.getElementById("menuButton").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));
    </script>
  </body>
</html>
